<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/config.js"></script>
  <script src="/avatar.js"></script>
</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <span class="logo">MyApp</span>
  </div>
  <div class="nav-right">
    <button onclick="location.href='/index.html'">Home</button>
  </div>
</nav>

<div class="form-container">
  <h2>Create Account</h2>

  <form id="signupForm">
    <label for="username">Username</label>
    <input id="username" name="username" placeholder="Username" required maxlength="32" autocomplete="username">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" placeholder="Password" required
           minlength="4" autocomplete="new-password">

    <label for="bio">Bio</label>
    <textarea id="bio" name="bio" maxlength="200" placeholder="Short bio (40 words max)"></textarea>

    <fieldset class="avatar-fieldset">
      <legend>Pick an avatar</legend>
      <p class="avatar-hint">
        Optional — leave it and you'll get one based on your username.
      </p>
      <div id="avatarPicker"></div>
    </fieldset>

    <button class="submit-btn" type="submit">Sign Up</button>
  </form>

  <p id="signupError" class="form-error" role="alert" hidden></p>

  <p style="margin-top:10px;">
    Already have an account? <a href="/login.html">Login</a>
  </p>
</div>

<script>
const getAvatar = buildAvatarPicker(document.getElementById('avatarPicker'), null);
const errorEl = document.getElementById('signupError');

function showError(message) {
  errorEl.textContent = message;
  errorEl.hidden = false;
}

document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.hidden = true;

  const button = e.target.querySelector('button[type="submit"]');
  button.disabled = true;

  try {
    // apiAuth stores the returned session token for subsequent requests
    const data = await apiAuth('/signup', {
      username: document.getElementById('username').value,
      password: document.getElementById('password').value,
      bio: document.getElementById('bio').value,
      avatar: getAvatar(),
    });

    if (data.success) {
      location.href = '/index.html';
    } else {
      showError(data.error || 'Could not create account');
    }
  } catch (err) {
    showError(apiErrorMessage(err));
  } finally {
    button.disabled = false;
  }
});
</script>

</body>
</html>
