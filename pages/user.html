<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>User Profile</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <span class="logo">MyApp</span>
  </div>
  <div class="nav-right">
    <button onclick="location.href='/index.html'">Home</button>
  </div>
</nav>

<div class="container">

  <div class="profile-card">
    <span id="avatar" class="avatar-slot"></span>
    <h2 id="profileUsername"></h2>
    <p id="profileBio"></p>
    <div id="followInfo" class="follow-info"></div>
    <button id="followButton" class="submit-btn" style="margin-top:12px; width:auto; min-width:160px;"></button>
    <button id="acceptFollowButton" class="submit-btn" style="margin-top:12px; width:auto; min-width:160px; display:none;">Accept Follow Request</button>
  </div>

  <h2>User Posts</h2>
  <div id="userPosts"></div>

</div>

<script src="/config.js"></script>
<script src="/avatar.js"></script>
<script src="/javascript.js"></script>
<script src="/user.js"></script>
</body>
</html>
