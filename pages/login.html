<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/config.js"></script>
  <script src="/avatar.js"></script>
</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <span class="logo">MyApp</span>
  </div>
  <div class="nav-right">
    <button onclick="location.href='/index.html'">Home</button>
  </div>
</nav>

<div class="form-container">
  <h2>Login</h2>

  <form id="loginForm">
    <label for="username">Username</label>
    <input id="username" name="username" placeholder="Username" required autocomplete="username">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" placeholder="Password" required
           autocomplete="current-password">

    <button class="submit-btn" type="submit">Login</button>
  </form>

  <p id="loginError" class="form-error" role="alert" hidden></p>

  <p style="margin-top:10px;">
    Don't have an account? <a href="/signup.html">Sign up</a>
  </p>
</div>

<script>
const errorEl = document.getElementById('loginError');

function showError(message) {
  errorEl.textContent = message;
  errorEl.hidden = false;
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.hidden = true;

  const button = e.target.querySelector('button[type="submit"]');
  button.disabled = true;

  try {
    // apiAuth stores the returned session token for subsequent requests
    const data = await apiAuth('/login', {
      username: document.getElementById('username').value.trim(),
      password: document.getElementById('password').value,
    });

    if (data.success) {
      location.href = '/index.html';
    } else {
      showError(data.error || 'Could not log in');
    }
  } catch (err) {
    // Covers the blocked-by-CORS case, which the browser reports as a bare
    // TypeError with no detail
    showError(apiErrorMessage(err));
  } finally {
    button.disabled = false;
  }
});
</script>

</body>
</html>
