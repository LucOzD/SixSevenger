<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Post View</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <span class="logo">SixSevenger</span>
  </div>
  <div class="nav-right">
    <button onclick="location.href='/index.html'">Home</button>
  </div>
</nav>

<div class="container">
  <div class="post-view-card" id="postCard"></div>

  <h2>Comments</h2>
  <div id="commentsList"></div>
</div>

<script src="/config.js"></script>
<script src="/avatar.js"></script>
<script src="/javascript.js"></script>
<script>
async function loadPostPage() {
  const params = new URLSearchParams(location.search);
  const postId = params.get('id');
  const highlightCommentId = params.get('highlightCommentId');

  if (!postId) {
    document.body.innerHTML = '<h1>Post not found</h1>';
    return;
  }

  const res = await api(`/post-details/${encodeURIComponent(postId)}`);
  if (!res.ok) {
    document.body.innerHTML = '<h1>Post not found</h1>';
    return;
  }

  const data = await res.json();
  const post = data.post;
  const postCard = document.getElementById('postCard');
  postCard.innerHTML = `
    <div class="global-post-header">
      ${avatarHtml(post.avatar, post.username)}
      <div class="global-post-username">${post.username || 'Unknown'}</div>
    </div>
    <div class="global-post-text">${escapeHtml(post.text)}</div>
    <div class="post-actions" style="gap:12px; margin-top:12px;">
      <span>👍 ${post.likes || 0}</span>
      <span>👎 ${post.dislikes || 0}</span>
    </div>
  `;

  const commentsRes = await api(`/post/${encodeURIComponent(postId)}/comments`);
  const comments = await commentsRes.json();
  const commentsList = document.getElementById('commentsList');

  if (!comments.length) {
    commentsList.innerHTML = '<div class="notification-empty">No comments yet.</div>';
    return;
  }

  commentsList.innerHTML = '';
  comments.forEach(comment => {
    const div = document.createElement('div');
    div.id = `comment-${comment.id}`;
    div.className = 'comment-item' + (String(comment.id) === highlightCommentId ? ' comment-highlight' : '');
    div.innerHTML = `
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
        ${avatarHtml(comment.avatar, comment.username)}
        <strong>${comment.username || 'Unknown'}</strong>
      </div>
      <div>${escapeHtml(comment.text)}</div>
      <div class="notification-item-meta" style="margin-top:8px;">${new Date(comment.timestamp).toLocaleString()}</div>
    `;
    commentsList.appendChild(div);
  });

  if (highlightCommentId) {
    const highlightEl = document.getElementById(`comment-${highlightCommentId}`);
    if (highlightEl) highlightEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

loadPostPage();
</script>
</body>
</html>
