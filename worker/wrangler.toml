name = "sixsevenger-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# ---------------------------------------------------------------------------
# D1 database. The database_id below is a placeholder — replace it with the id
# printed by:  npx wrangler d1 create sixsevenger
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "sixsevenger"
database_id = "b8985d4f-abb0-48d7-81d2-0f059e216cb6"

[vars]
# Origins allowed to call this API with credentials. Browsers reject "*" when a
# request carries cookies, so origins must be named.
#
# The scheme MUST match what the browser sends. Cloudflare serves custom domains
# over HTTPS, so custom domains belong here as https:// — an http:// entry will
# never match and the request is rejected with no explanation in the browser.
# Only localhost should be http.
#
# A leading "*." wildcard is allowed in the hostname, which is how Pages preview
# deployments are covered (each gets its own subdomain). Wildcards over shared
# hosting domains like "https://*.pages.dev" are refused by the Worker, because
# that would let anyone else's site on that host call this API using a logged-in
# visitor's cookie.
ALLOWED_ORIGINS = "https://sixsevenger.pages.dev,https://*.sixsevenger.pages.dev,https://*.lucasdrane.com,https://lucasdrane.com,http://localhost:8788,http://127.0.0.1:8788"


# Session cookies use SameSite=None so they work across the Pages and Worker
# domains, which also requires Secure (HTTPS). For local HTTP development set
# this to "Lax" instead, otherwise the browser will drop the cookie.
SESSION_SAMESITE = "None"

[observability]
enabled = true
